media:
  input: public/media
  output: /media
  rename: safe
  extensions:
    - jpg
    - jpeg
    - png
    - webp
    - avif
    - svg
content:
  - name: coffees
    label: Cafés
    type: collection
    path: content/coffees
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    subfolders: false
    exclude:
      - .gitkeep
    view:
      primary: name
    operations:
      create: true
      rename: false
      delete: false
    fields:
      - name: id
        label: Identificador permanente (letras minúsculas, números e hífen)
        type: string
        required: true
      - name: slug
        label: Endereço permanente (não alterar após publicar)
        type: string
        required: true
      - name: name
        label: Nome do café
        type: string
        required: true
      - name: description
        label: Apresentação
        type: text
        required: true
      - name: longDescription
        label: Descrição completa (opcional; vazio = só a apresentação)
        type: text
      - name: highlights
        label: Destaques (frases curtas confirmadas; opcional)
        type: string
        list: true
      - name: seoTitle
        label: "SEO · Título da página (opcional; vazio = nome do café)"
        type: string
      - name: seoDescription
        label: "SEO · Descrição para buscadores (opcional; vazio = apresentação)"
        type: text
      - name: status
        label: Estado editorial
        type: select
        required: true
        default: draft
        options:
          values:
            - name: draft
              label: Rascunho
            - name: published
              label: Publicado
            - name: archived
              label: Arquivado
      - name: sortOrder
        label: Ordem de exibição
        type: number
        required: true
        default: 0
      - name: primaryLotId
        label: Lote principal (opcional)
        type: reference
        options:
          collection: lots
          value: "{fields.id}"
          label: "{fields.code}"
      - name: tone
        label: Cor editorial
        type: select
        required: true
        default: cura
        options:
          values:
            - name: cura
              label: Marrom Cura (neutro)
            - name: rapadura
              label: Rapadura · caramelado
            - name: anil
              label: Anil · cítrico
            - name: amora
              label: Amora · frutado
            - name: ipe
              label: Ipê · floral
            - name: cacau
              label: Cacau · achocolatado
      - name: media
        label: Foto autorizada (opcional)
        type: object
        fields:
          - name: kind
            label: Natureza da imagem
            type: select
            default: photograph
            options:
              values:
                - name: photograph
                  label: Fotografia autorizada
                - name: artwork
                  label: Arte oficial (não é fotografia)
                - name: illustration
                  label: Ilustração da embalagem (cena criada digitalmente)
          - name: lotId
            label: Lote representado (vincular rótulos; vazio apenas para foto geral)
            type: reference
            options:
              collection: lots
              value: "{fields.id}"
              label: "{fields.code}"
          - name: src
            label: Imagem
            type: image
            options:
              extensions:
                - jpg
                - jpeg
                - png
                - webp
                - avif
                - svg
            required: true
          - name: alt
            label: Descrição acessível
            type: string
            required: true
          - name: credit
            label: Crédito / autoria
            type: string
            required: true
      - name: gallery
        label: Galeria de fotos do produto (opcional; somente imagens autorizadas)
        type: object
        list: true
        fields:
          - name: kind
            label: Natureza da imagem
            type: select
            default: photograph
            options:
              values:
                - name: photograph
                  label: Fotografia autorizada
                - name: artwork
                  label: Arte oficial (não é fotografia)
                - name: illustration
                  label: Ilustração da embalagem (cena criada digitalmente)
          - name: src
            label: Imagem
            type: image
            options:
              extensions:
                - jpg
                - jpeg
                - png
                - webp
                - avif
                - svg
            required: true
          - name: alt
            label: Descrição acessível
            type: string
            required: true
          - name: credit
            label: Crédito / autoria
            type: string
            required: true
  - name: lots
    label: Lotes
    type: collection
    path: content/lots
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    subfolders: false
    exclude:
      - .gitkeep
    view:
      primary: code
    operations:
      create: true
      rename: false
      delete: false
    fields:
      - name: id
        label: Identificador permanente (letras minúsculas, números e hífen)
        type: string
        required: true
      - name: coffeeId
        label: Café
        type: reference
        options:
          collection: coffees
          value: "{fields.id}"
          label: "{fields.name}"
        required: true
      - name: code
        label: Código de rastreabilidade
        type: string
        required: true
      - name: status
        label: Estado editorial
        type: select
        required: true
        default: draft
        options:
          values:
            - name: draft
              label: Rascunho
            - name: published
              label: Publicado
            - name: archived
              label: Arquivado
      - name: sortOrder
        label: Ordem de exibição
        type: number
        required: true
        default: 0
      - name: profile
        label: Perfil sensorial
        type: string
      - name: notes
        label: Notas sensoriais
        type: string
        list: true
      - name: producers
        label: Quem produz
        type: string
        list: true
      - name: preparations
        label: Preparos sugeridos
        type: string
        list: true
      - name: acidity
        label: Acidez
        type: string
      - name: body
        label: Corpo
        type: string
      - name: origin
        label: Origem confirmada
        type: string
      - name: variety
        label: Variedade
        type: string
      - name: roast
        label: Torra
        type: string
      - name: score
        label: Pontuação confirmada (0–100)
        type: number
      - name: scoreMethodology
        label: "Metodologia da pontuação (ex.: SCA; somente se confirmada)"
        type: string
      - name: producerStory
        label: História de quem produz (somente texto confirmado e autorizado; opcional)
        type: text
      - name: curationNote
        label: Por que escolhemos (publicar somente motivo confirmado)
        type: text
      - name: region
        label: "Experiência · Região produtora (ex.: Campos Altos – MG; somente se confirmada)"
        type: string
      - name: municipality
        label: "Município / UF (somente se confirmado)"
        type: string
      - name: farm
        label: "Experiência · Fazenda (somente se confirmada)"
        type: string
      - name: altitudeMeters
        label: "Experiência · Altitude em metros (somente se confirmada)"
        type: number
      - name: process
        label: "Experiência · Processamento (ex.: Natural, Lavado, Honey)"
        type: string
      - name: harvest
        label: "Experiência · Safra (ex.: 2026)"
        type: string
      - name: latitude
        label: "Experiência · Latitude da fazenda (somente coordenada real e autorizada; preencher junto com longitude)"
        type: number
      - name: longitude
        label: "Experiência · Longitude da fazenda (somente coordenada real e autorizada)"
        type: number
      - name: intensityLevel
        label: "Experiência · Intensidade (1 a 5, da ficha sensorial oficial; vazio = oculto)"
        type: number
      - name: acidityLevel
        label: "Experiência · Acidez (1 a 5, da ficha sensorial oficial; vazio = oculto)"
        type: number
      - name: sweetnessLevel
        label: "Experiência · Doçura (1 a 5, da ficha sensorial oficial; vazio = oculto)"
        type: number
      - name: bodyLevel
        label: "Experiência · Corpo (1 a 5, da ficha sensorial oficial; vazio = oculto)"
        type: number
      - name: saleStartsAt
        label: "Venda · Início (AAAA-MM-DD; vazio = sem data)"
        type: string
      - name: saleEndsAt
        label: "Venda · Fim (AAAA-MM-DD; vazio = sem data). Nova safra = novo lote; arquive o antigo, não apague."
        type: string
  - name: offers
    label: Ofertas (embalagens à venda; preço confirmado em centavos)
    type: collection
    path: content/offers
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    subfolders: false
    exclude:
      - .gitkeep
    view:
      primary: sku
    operations:
      create: true
      rename: false
      delete: false
    fields:
      - name: id
        label: Identificador permanente (letras minúsculas, números e hífen)
        type: string
        required: true
      - name: lotId
        label: Lote
        type: reference
        options:
          collection: lots
          value: "{fields.id}"
          label: "{fields.code}"
        required: true
      - name: status
        label: Estado editorial
        type: select
        required: true
        default: draft
        options:
          values:
            - name: draft
              label: Rascunho
            - name: published
              label: Publicado
            - name: archived
              label: Arquivado
      - name: sku
        label: SKU confirmado
        type: string
        required: true
      - name: currency
        label: Moeda
        type: select
        default: BRL
        required: true
        options:
          values:
            - BRL
      - name: unitPriceInCents
        label: Preço confirmado em centavos (vazio = desconhecido)
        type: number
      - name: availableQuantity
        label: Estoque editorial (referência; o estoque de venda é controlado no banco da loja)
        type: number
      - name: weightInGrams
        label: Peso confirmado em gramas
        type: number
      - name: grind
        label: Moagem confirmada
        type: string
      - name: promoPriceInCents
        label: Preço promocional aprovado em centavos (vazio = sem promoção; menor que o preço)
        type: number
      - name: commercialLabel
        label: "Selo comercial (ex.: Novo lote; opcional, somente se verdadeiro)"
        type: string
      - name: grossWeightInGrams
        label: "Envio · Peso bruto da unidade embalada, em gramas (obrigatório para vender)"
        type: number
      - name: packageHeightCm
        label: "Envio · Altura da embalagem em cm (obrigatório para vender)"
        type: number
      - name: packageWidthCm
        label: "Envio · Largura da embalagem em cm (obrigatório para vender)"
        type: number
      - name: packageLengthCm
        label: "Envio · Comprimento da embalagem em cm (obrigatório para vender)"
        type: number
      - name: minQuantity
        label: Quantidade mínima por pedido (vazio = 1)
        type: number
      - name: maxQuantity
        label: Quantidade máxima por pedido (vazio = regra geral da loja)
        type: number
      - name: saleStartsAt
        label: "Venda · Início (AAAA-MM-DD; vazio = sem data)"
        type: string
      - name: saleEndsAt
        label: "Venda · Fim (AAAA-MM-DD; vazio = sem data)"
        type: string
  - name: bundles
    label: Kits (ex. Kit descoberta)
    type: collection
    path: content/bundles
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    subfolders: false
    exclude:
      - .gitkeep
    view:
      primary: name
    operations:
      create: true
      rename: false
      delete: false
    fields:
      - name: id
        label: Identificador permanente (letras minúsculas, números e hífen)
        type: string
        required: true
      - name: name
        label: Nome do kit
        type: string
        required: true
      - name: description
        label: Descrição
        type: text
        required: true
      - name: status
        label: Estado editorial
        type: select
        required: true
        default: draft
        options:
          values:
            - name: draft
              label: Rascunho
            - name: published
              label: Publicado
            - name: archived
              label: Arquivado
      - name: sortOrder
        label: Ordem de exibição
        type: number
        required: true
        default: 0
      - name: priceInCents
        label: Preço aprovado do kit em centavos (vazio = kit não é vendido)
        type: number
      - name: items
        label: Itens do kit
        type: object
        list: true
        required: true
        fields:
          - name: offerId
            label: Oferta
            type: reference
            required: true
            options:
              collection: offers
              value: "{fields.id}"
              label: "{fields.sku}"
          - name: quantity
            label: Quantidade
            type: number
            required: true
            default: 1
  - name: commerce
    label: Regras comerciais da loja
    type: file
    path: content/commerce.json
    format: json
    fields:
      - name: freeShippingFromCents
        label: Frete grátis a partir de (centavos; vazio = sem frete grátis aprovado)
        type: number
      - name: maxQuantityPerLine
        label: Quantidade máxima por item no carrinho
        type: number
        required: true
        default: 10
      - name: pixExpirationMinutes
        label: Validade do Pix em minutos
        type: number
        required: true
        default: 30
      - name: cardExpirationMinutes
        label: Prazo para pagar com cartão, em minutos (depois o pedido expira e o estoque volta)
        type: number
        required: true
        default: 60
      - name: pixDiscountPercent
        label: Desconto no Pix (% sobre os cafés, nunca sobre o frete)
        type: number
        required: true
        default: 0
      - name: cardFeeAssumptionPercent
        label: "Taxa estimada do cartão (% · uso interno nos indicadores; nunca cobrada do cliente)"
        type: number
        required: true
        default: 0
      - name: shippingSubsidyCents
        label: Subsídio fixo de frete em centavos (vazio = cliente paga todo o frete)
        type: number
      - name: maxVolumeWeightGrams
        label: Peso máximo por volume em gramas
        type: number
        required: true
        default: 4000
      - name: packingFillFactor
        label: Ocupação máxima da caixa (0,3 a 1; ex. 0,8 = 80% do volume interno)
        type: number
        required: true
        default: 0.8
      - name: shippingServiceIds
        label: "Serviços do Melhor Envio oferecidos (ids; ex. 1 = Correios PAC, 3 = Jadlog .Package)"
        type: string
        list: true
      - name: boxes
        label: Caixas de envio (medidas reais da embalagem de transporte)
        type: object
        list: true
        fields:
          - name: id
            label: Identificador (letras minúsculas e hífen)
            type: string
            required: true
          - name: label
            label: Nome
            type: string
            required: true
          - name: innerHeightCm
            label: Altura interna (cm)
            type: number
            required: true
          - name: innerWidthCm
            label: Largura interna (cm)
            type: number
            required: true
          - name: innerLengthCm
            label: Comprimento interno (cm)
            type: number
            required: true
          - name: outerHeightCm
            label: Altura externa (cm)
            type: number
            required: true
          - name: outerWidthCm
            label: Largura externa (cm)
            type: number
            required: true
          - name: outerLengthCm
            label: Comprimento externo (cm)
            type: number
            required: true
          - name: tareGrams
            label: Peso da caixa vazia com proteção (g)
            type: number
            required: true
